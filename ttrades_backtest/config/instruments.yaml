# =============================================================================
# Instrument metadata for CME micro futures.
#
# tick_size    : minimum price increment (in PRICE/points)
# tick_value   : USD value of one tick for ONE contract
# point_value  : USD value of a full 1.00 price move for ONE contract
#                (point_value = tick_value / tick_size)
#
# Cost model (all CONFIGURABLE and deliberately CONSERVATIVE):
#   commission_per_side_usd : broker + exchange + NFA fees, per contract, per side.
#                             Round-trip cost = 2 * commission_per_side_usd.
#   slippage_ticks_per_side : adverse slippage applied to MARKET / stop fills,
#                             in ticks, per side. Limit fills get 0 (they only
#                             fill if price trades THROUGH the resting level).
#   spread_ticks            : assumed bid/ask width; market entries cross it.
#
# These defaults are intentionally pessimistic for micros. Override per run.
# Sources for contract specs: CME Group contract specifications.
# =============================================================================

defaults:
  commission_per_side_usd: 0.75   # ~ $0.25 broker + ~$0.37 exch/NFA, rounded up
  slippage_ticks_per_side: 1.0    # 1 tick adverse on market/stop fills
  spread_ticks: 1.0               # micros are typically 1 tick wide

instruments:

  MNQ:                            # Micro E-mini Nasdaq-100
    name: "Micro E-mini Nasdaq-100"
    tick_size: 0.25
    tick_value: 0.50              # $0.50 per 0.25 tick
    point_value: 2.0              # $2.00 per 1.00 index point
    currency: USD
    # micro-specific cost overrides (fall back to defaults if omitted)
    commission_per_side_usd: 0.75
    slippage_ticks_per_side: 1.0
    spread_ticks: 1.0

  MES:                            # Micro E-mini S&P 500
    name: "Micro E-mini S&P 500"
    tick_size: 0.25
    tick_value: 1.25              # $1.25 per 0.25 tick
    point_value: 5.0              # $5.00 per 1.00 index point
    currency: USD
    commission_per_side_usd: 0.75
    slippage_ticks_per_side: 1.0
    spread_ticks: 1.0

  MGC:                            # Micro Gold (10 troy oz)
    name: "Micro Gold"
    tick_size: 0.10
    tick_value: 1.00              # $1.00 per 0.10 tick
    point_value: 10.0             # $10.00 per $1.00 move
    currency: USD
    commission_per_side_usd: 0.75
    slippage_ticks_per_side: 1.0
    spread_ticks: 1.0

  MCL:                            # Micro WTI Crude Oil (100 barrels)
    name: "Micro WTI Crude Oil"
    tick_size: 0.01
    tick_value: 1.00              # $1.00 per 0.01 tick
    point_value: 100.0            # $100.00 per $1.00 move
    currency: USD
    commission_per_side_usd: 0.85 # crude often slightly worse fills
    slippage_ticks_per_side: 1.0
    spread_ticks: 1.0
